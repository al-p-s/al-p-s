name: Profile generator

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e63946&color_dots=#1a0509,#4a0d17,#7a1020,#b3182a,#ff2a3d

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 1
          THEME: "tokyonight"
          AUTO_PUSH: false

      - name: Recolor cards (black / burgundy / dark red)
        run: |
          for f in profile-summary-card-output/tokyonight/*.svg; do
            sed -i \
              -e 's/stroke="#1a1b27"/stroke="#7a1020"/gI' \
              -e 's/#1a1b27/#0d0204/gI' \
              -e 's/#70a5fd/#e63946/gI' \
              -e 's/#38bdae/#f1c0c0/gI' \
              -e 's/#bf91f3/#ff4d4d/gI' \
              "$f"
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile summary cards"
            git pull --rebase
            git push
          fi
